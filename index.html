<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore the world's leading concert venues with decent.music." />
    <meta name="theme-color" content="#f4f7fb" />
    <title>decent.music — Global Concert Venues</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3PLQN3VGGT"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("js", new Date());
      gtag("config", "G-3PLQN3VGGT");
    </script>
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <a class="wordmark" href="/" aria-label="decent.music home">
          <img class="wordmark__logo" src="/assets/images/decent.png" alt="decent" width="4836" height="1926" />
          <span class="wordmark__extension">.music</span>
        </a>
        <div class="header-actions">
          <span class="venue-count" id="venue-count" aria-live="polite">Loading venues…</span>
          <button class="reset-button" id="reset-view" type="button">View globe</button>
        </div>
      </header>

      <main class="map-stage">
        <div id="map" class="map" role="region" aria-label="Interactive globe showing concert venues"></div>
        <section class="map-intro" id="map-intro" aria-labelledby="map-heading">
          <p class="eyebrow">Explore live music</p>
          <h1 id="map-heading">The world’s stages, in one place.</h1>
          <p>Select a cluster or venue to discover where the world gathers for music.</p>
          <button id="dismiss-intro" type="button">Explore the map</button>
        </section>
        <div class="map-status" id="map-status" role="status">Preparing the globe…</div>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
